services:
  broker:
    image: apache/kafka:4.0.2
    hostname: broker
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://broker:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  event-management-db:
    image: postgres:17.9
    environment:
      POSTGRES_USER: main
      POSTGRES_PASSWORD: password
      POSTGRES_DB: event-management
    ports:
      - "5432:5432"
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    volumes:
      - db_data:/var/lib/postgresql/data

  connect:
    image: quay.io/debezium/connect:3.5
    ports:
      - "8083:8083"
    depends_on:
      - broker
      - event-management-db
    environment:
      BOOTSTRAP_SERVERS: broker:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"

  redis:
    image: redis:8.6.2
    ports:
      - "6379:6379"

  event-management-api:
    build:
      context: ./event-management/
    ports:
      - "8080:8080"
    depends_on:
      - event-management-db
      - redis
    environment:
      POSTGRES_HOST: event-management-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: main
      POSTGRES_PASSWORD: password
      POSTGRES_DBNAME: event-management
      POSTGRES_SSLMODE: disable
      POSTGRES_TIMEZONE: UTC
      POSTGRES_MAX_OPEN_CONNS: 25
      POSTGRES_CONN_MAX_LIFETIME: 300
      POSTGRES_MAX_IDLE_CONNS: 10
      POSTGRES_CONN_MAX_IDLE_TIME: 60
      SERVER_MODE: development
      SERVER_ADDR: ":8080"
      SERVER_READ_TIMEOUT: 10
      SERVER_WRITE_TIMEOUT: 10
      SERVER_MAX_HEADER_BYTES: 1048576
      SERVER_CTX_TIMEOUT: 30
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

  booking-api:
    build:
      context: ./booking/
    ports:
      - "8081:8080"
    depends_on:
      - event-management-db
      - redis
    environment:
      POSTGRES_HOST: event-management-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: main
      POSTGRES_PASSWORD: password
      POSTGRES_DBNAME: event-management
      POSTGRES_SSLMODE: disable
      POSTGRES_TIMEZONE: UTC
      POSTGRES_MAX_OPEN_CONNS: 25
      POSTGRES_CONN_MAX_LIFETIME: 300
      POSTGRES_MAX_IDLE_CONNS: 10
      POSTGRES_CONN_MAX_IDLE_TIME: 60
      SERVER_MODE: development
      SERVER_ADDR: ":8080"
      SERVER_READ_TIMEOUT: 10
      SERVER_WRITE_TIMEOUT: 10
      SERVER_MAX_HEADER_BYTES: 1048576
      SERVER_CTX_TIMEOUT: 30
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

volumes:
  db_data:
